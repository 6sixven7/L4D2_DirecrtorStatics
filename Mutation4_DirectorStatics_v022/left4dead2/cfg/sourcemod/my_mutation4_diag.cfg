// Mutation4 导演诊断修订版 0.2.2（配置项与0.2.0相同）
// 此文件由插件在加载配置时执行。修改后可在服务器控制台执行：
// exec sourcemod/my_mutation4_diag.cfg

// 1=约每秒自动记录；0=关闭自动记录和阶段变化记录。
// 关闭后，管理员仍可用 sm_m4diag_snapshot 手动记录一份快照。
sm_m4diag_enable "1"

// 自动快照间隔，单位为游戏秒，最小0.1，默认1.0。
// 按天分日志文件，不自动删除旧日志。
sm_m4diag_interval "1.0"

// 1=尝试读取经函数特征和结构校验的导演内部字段；0=只记录基础接口。
// 本版提供Windows x86、Linux x86内部定位，并自动选择相应校验方式。
// Linux已按提供的32位2.2.4.3样本完成静态核对，尚需服务器运行验证；不承诺64位支持。
// 特征不匹配、前置不可用等情况也会自动降级，并记录具体原因。
// 此开关不修改导演参数，不影响实际阶段、刷怪或地图脚本。
sm_m4diag_internal "1"
